<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PipeLab - 45s GitHub Demo Video Recorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070a14;
  --card: #0d1527;
  --card-border: #1e293b;
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.35);
  --green: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
  --purple: #a855f7;
  --pink: #ec4899;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --c-if: #38bdf8;
  --c-id: #a855f7;
  --c-ex: #10b981;
  --c-mem: #f59e0b;
  --c-wb: #ec4899;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}
header {
  height: 56px;
  background: rgba(13, 21, 39, 0.95);
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-title {
  font-weight: 800;
  font-size: 16px;
  color: #f8fafc;
  letter-spacing: -0.3px;
}
.brand-sub {
  font-size: 12px;
  color: var(--text-muted);
}
.badge-rec {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #f87171;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  font-family: 'JetBrains Mono', monospace;
}
.rec-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ef4444;
  box-shadow: 0 0 8px #ef4444;
  animation: pulse 1s infinite alternate;
}
@keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }

/* Stage */
.stage {
  flex: 1;
  padding: 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}
.video-frame {
  flex: 1;
  background: #020617;
  border: 1px solid #1e293b;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
}

/* Simulated Cursor */
.virtual-cursor {
  position: absolute;
  width: 22px;
  height: 22px;
  pointer-events: none;
  z-index: 100;
  transition: all 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
  transform: translate(-2px, -2px);
}
.virtual-cursor svg {
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
}
.cursor-click-ring {
  position: absolute;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  top: -7px;
  left: -7px;
  opacity: 0;
  transform: scale(0.5);
  transition: all 0.3s ease-out;
  pointer-events: none;
}
.cursor-click-ring.click {
  opacity: 1;
  transform: scale(1.6);
  border-color: #38bdf8;
}

/* Top Overlay */
.video-top-bar {
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(180deg, rgba(2,6,23,0.95), transparent);
  z-index: 10;
}
.step-pill {
  background: rgba(56, 189, 248, 0.15);
  border: 1px solid rgba(56, 189, 248, 0.4);
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.music-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  background: rgba(15, 23, 42, 0.8);
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid #1e293b;
}

/* Video Canvas */
.video-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 10px 40px 20px;
  position: relative;
  justify-content: center;
}

.scene-header {
  margin-bottom: 20px;
  text-align: left;
}
.scene-title {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
}
.scene-tag {
  font-size: 12px;
  background: var(--card);
  border: 1px solid #334155;
  color: #38bdf8;
  padding: 3px 10px;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
}
.scene-instruction {
  font-size: 14px;
  color: #94a3b8;
  margin-top: 6px;
  line-height: 1.4;
}

.sim-app-window {
  background: #0b1329;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.sim-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #070d1e;
  border: 1px solid #1e293b;
  border-radius: 8px;
  padding: 8px 14px;
}
.sim-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.sim-select {
  background: #0f172a;
  border: 1px solid #334155;
  color: #f8fafc;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 6px 12px;
  border-radius: 6px;
  font-weight: 600;
}
.sim-select.highlight {
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}
.sim-btn {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  border: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sim-btn-step {
  background: rgba(56, 189, 248, 0.15);
  color: var(--accent);
  border: 1px solid rgba(56, 189, 248, 0.4);
}
.sim-btn-step.active {
  background: var(--accent);
  color: #020617;
  transform: scale(0.96);
}
.sim-btn-run {
  background: linear-gradient(135deg, var(--green), #059669);
  color: #fff;
}
.sim-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 600;
  color: #94a3b8;
}
.toggle-switch {
  width: 36px;
  height: 20px;
  background: #1e293b;
  border-radius: 10px;
  position: relative;
  transition: all 0.3s;
}
.toggle-switch.on { background: var(--green); }
.toggle-circle {
  width: 14px;
  height: 14px;
  background: #fff;
  border-radius: 50%;
  position: absolute;
  top: 3px;
  left: 3px;
  transition: all 0.3s;
}
.toggle-switch.on .toggle-circle { left: 19px; }

.sim-stages {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.stage-card {
  background: #0f172a;
  border: 2px solid;
  border-radius: 8px;
  padding: 10px 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: all 0.3s;
}
.stage-card.if { border-color: var(--c-if); }
.stage-card.id { border-color: var(--c-id); }
.stage-card.ex { border-color: var(--c-ex); }
.stage-card.mem { border-color: var(--c-mem); }
.stage-card.wb { border-color: var(--c-wb); }
.stage-card.active {
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
  transform: translateY(-2px);
}
.sc-tag { font-size: 9px; font-weight: 700; color: #64748b; text-transform: uppercase; }
.sc-name { font-size: 14px; font-weight: 800; }
.sc-instr { font-size: 10px; font-family: 'JetBrains Mono', monospace; color: #cbd5e1; }

.sim-grid-wrap {
  background: #060a17;
  border: 1px solid #1e293b;
  border-radius: 8px;
  padding: 10px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
}
.grid-table {
  width: 100%;
  border-collapse: collapse;
}
.grid-table th {
  padding: 4px 6px;
  color: #64748b;
  border-bottom: 1px solid #1e293b;
  font-weight: 600;
}
.grid-table td {
  padding: 5px 6px;
  text-align: center;
  border: 1px solid #151e33;
}
.cell-if { background: rgba(56, 189, 248, 0.25); color: var(--c-if); font-weight: 700; }
.cell-id { background: rgba(168, 85, 247, 0.25); color: var(--c-id); font-weight: 700; }
.cell-ex { background: rgba(16, 185, 129, 0.25); color: var(--c-ex); font-weight: 700; }
.cell-mem { background: rgba(245, 158, 11, 0.25); color: var(--c-mem); font-weight: 700; }
.cell-wb { background: rgba(236, 72, 153, 0.25); color: var(--c-wb); font-weight: 700; }
.cell-stall {
  background: repeating-linear-gradient(45deg, rgba(245,158,11,0.15), rgba(245,158,11,0.15) 4px, rgba(245,158,11,0.3) 4px, rgba(245,158,11,0.3) 8px);
  color: var(--amber);
  font-weight: 700;
}

.sim-compare-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
}
.sim-compare-table th {
  background: #060a17;
  padding: 8px 12px;
  color: #64748b;
  text-align: left;
  border-bottom: 1px solid #1e293b;
}
.sim-compare-table td {
  padding: 8px 12px;
  border-bottom: 1px solid #151e33;
  color: #cbd5e1;
}
.sim-compare-table tr.winner {
  background: rgba(16, 185, 129, 0.12);
  border-left: 3px solid var(--green);
}
.sim-compare-table tr.winner td {
  color: #fff;
  font-weight: 700;
}
.trophy-badge {
  background: rgba(16, 185, 129, 0.2);
  border: 1px solid var(--green);
  color: #34d399;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 10px;
}

.action-callout {
  margin-top: 14px;
  background: rgba(56, 189, 248, 0.08);
  border: 1px solid rgba(56, 189, 248, 0.25);
  border-radius: 8px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.ac-icon { font-size: 18px; }
.ac-text { font-size: 13px; color: #e2e8f0; font-weight: 600; }
.ac-text span { color: var(--accent); }

/* Bottom Bar */
.player-controls {
  height: 64px;
  background: #090e1d;
  border-top: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  border-radius: 0 0 16px 16px;
}
.btn-play {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--accent);
  color: #020617;
  border: none;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.btn-play:hover { transform: scale(1.08); }
.timer-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: #94a3b8;
  font-weight: 600;
  min-width: 90px;
}
.progress-track {
  flex: 1;
  height: 6px;
  background: #1e293b;
  border-radius: 3px;
  position: relative;
  cursor: pointer;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--green));
  border-radius: 3px;
  transition: width 0.1s linear;
}
.btn-record {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
}
.btn-record:hover { transform: translateY(-1px); }
.btn-audio-mute {
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid #334155;
  color: #f1f5f9;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-title">PipeLab</div>
    <div class="brand-sub">| 45s GitHub Demonstration Video</div>
  </div>
  <div style="display:flex; gap:12px; align-items:center;">
    <div class="badge-rec">
      <div class="rec-dot"></div>
      <span id="recStatusText">READY FOR GITHUB</span>
    </div>
  </div>
</header>

<div class="stage">
  <div class="video-frame" id="videoFrame">
    <!-- Virtual Cursor Pointer -->
    <div class="virtual-cursor" id="virtualCursor" style="top: 140px; left: 160px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M5.5 3.5L18.5 12L11.5 13.5L8.5 20.5L5.5 3.5Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <div class="cursor-click-ring" id="clickRing"></div>
    </div>

    <!-- Top Overlay -->
    <div class="video-top-bar">
      <div class="step-pill" id="stepPill">STEP 1 OF 3: SHOW A PROGRAM RUNNING</div>
      <div class="music-badge">
        <span>🎵 Synth Background (Web Audio)</span>
      </div>
    </div>

    <!-- Video Stage Canvas -->
    <div class="video-body" id="videoBody">
      <!-- Injected by JavaScript based on current time (0-45s) -->
    </div>

    <!-- Player Controls Bar -->
    <div class="player-controls">
      <button class="btn-play" id="btnPlay" onclick="togglePlay()">▶</button>
      <div class="timer-text" id="timerText">0:00 / 0:45</div>
      <div class="progress-track" onclick="seekTrack(event)">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <button class="btn-audio-mute" id="btnMute" onclick="toggleMute()">🔊 Music: ON</button>
      <button class="btn-record" id="btnRecord" onclick="recordVideoForGithub()">
        <span>🔴</span> Record for GitHub (Win + Alt + R)
      </button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  WEB AUDIO SYNTHESIZER (Tech Ambient Background Music - No Voice)
// ═══════════════════════════════════════════════════════════════════
let audioCtx = null;
let isMuted = false;
let musicTimer = null;
const NOTES = [220, 261.63, 293.66, 329.63, 392, 440, 523.25];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playNote(freq, dur = 0.25, time = 0) {
  if (isMuted || !audioCtx) return;
  try {
    const now = audioCtx.currentTime + time;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, now);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.06, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + dur);
  } catch(e) {}
}

function startMusicLoop() {
  if (musicTimer) clearInterval(musicTimer);
  let step = 0;
  musicTimer = setInterval(() => {
    if (!isPlaying) return;
    const note = NOTES[step % NOTES.length];
    playNote(note, 0.4, 0);
    if (step % 2 === 0) {
      playNote(110, 0.6, 0);
    }
    step++;
  }, 350);
}

function toggleMute() {
  isMuted = !isMuted;
  document.getElementById('btnMute').textContent = isMuted ? '🔇 Music: MUTED' : '🔊 Music: ON';
}

// ═══════════════════════════════════════════════════════════════════
//  45-SECOND TIMELINE CONTROLLER
// ═══════════════════════════════════════════════════════════════════
const TOTAL_DURATION = 45;
let currentTime = 0;
let isPlaying = false;
let mainTimer = null;

const cursor = document.getElementById('virtualCursor');
const ring = document.getElementById('clickRing');

function moveCursor(x, y, click = false) {
  cursor.style.left = x + 'px';
  cursor.style.top = y + 'px';
  if (click) {
    setTimeout(() => {
      ring.classList.add('click');
      setTimeout(() => ring.classList.remove('click'), 300);
    }, 400);
  }
}

function renderFrame(sec) {
  const vb = document.getElementById('videoBody');
  const pill = document.getElementById('stepPill');

  if (sec >= 0 && sec < 15) {
    pill.textContent = "STEP 1 OF 3: SHOW A PROGRAM RUNNING";
    const subCycle = Math.min(5, Math.floor((sec / 15) * 6));

    if (sec < 5) {
      moveCursor(210, 160, true);
    } else if (sec < 10) {
      moveCursor(380, 160, true);
    } else {
      moveCursor(450, 360, false);
    }

    vb.innerHTML = `
      <div class="scene-header">
        <div class="scene-title">
          <span>1. Select Program &amp; Step Execution</span>
          <span class="scene-tag">Array Sum Preset</span>
        </div>
        <div class="scene-instruction">
          Click <b>▶ Step</b> to show instructions advancing through <b>IF → ID → EX → MEM → WB</b>.
        </div>
      </div>

      <div class="sim-app-window">
        <div class="sim-toolbar">
          <div class="sim-left">
            <span style="font-size:11px; color:#94a3b8; font-weight:600;">Sample Program:</span>
            <div class="sim-select ${sec < 5 ? 'highlight' : ''}">5: Array Sum (LW, ADD, SW)</div>
            <button class="sim-btn sim-btn-step ${sec >= 5 && sec < 10 ? 'active' : ''}">⏭ Step Cycle</button>
          </div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#38bdf8; font-weight:700;">
            Cycle: ${Math.max(1, subCycle)}
          </div>
        </div>

        <div class="sim-stages">
          <div class="stage-card if ${subCycle >= 1 ? 'active' : ''}">
            <div class="sc-tag">Fetch</div>
            <div class="sc-name" style="color:var(--c-if)">IF</div>
            <div class="sc-instr">${subCycle >= 1 ? 'ADD R4, R1, R3' : '—'}</div>
          </div>
          <div class="stage-card id ${subCycle >= 2 ? 'active' : ''}">
            <div class="sc-tag">Decode</div>
            <div class="sc-name" style="color:var(--c-id)">ID</div>
            <div class="sc-instr">${subCycle >= 2 ? 'LW R3, 4(R2)' : '—'}</div>
          </div>
          <div class="stage-card ex ${subCycle >= 3 ? 'active' : ''}">
            <div class="sc-tag">Execute</div>
            <div class="sc-name" style="color:var(--c-ex)">EX</div>
            <div class="sc-instr">${subCycle >= 3 ? 'LW R1, 0(R2)' : '—'}</div>
          </div>
          <div class="stage-card mem ${subCycle >= 4 ? 'active' : ''}">
            <div class="sc-tag">Memory</div>
            <div class="sc-name" style="color:var(--c-mem)">MEM</div>
            <div class="sc-instr">${subCycle >= 4 ? 'ADDI R2, R0, 10' : '—'}</div>
          </div>
          <div class="stage-card wb ${subCycle >= 5 ? 'active' : ''}">
            <div class="sc-tag">Writeback</div>
            <div class="sc-name" style="color:var(--c-wb)">WB</div>
            <div class="sc-instr">${subCycle >= 5 ? 'ADDI R2, R0, 10' : '—'}</div>
          </div>
        </div>

        <div class="sim-grid-wrap">
          <table class="grid-table">
            <thead>
              <tr>
                <th style="text-align:left;">Instruction</th>
                <th>C1</th><th>C2</th><th>C3</th><th>C4</th><th>C5</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="text-align:left; color:#f8fafc;">LW R1, 0(R2)</td>
                <td class="cell-if">IF</td>
                <td class="cell-id ${subCycle >= 2 ? '' : 'style=\"opacity:0\"'}">ID</td>
                <td class="cell-ex ${subCycle >= 3 ? '' : 'style=\"opacity:0\"'}">EX</td>
                <td class="cell-mem ${subCycle >= 4 ? '' : 'style=\"opacity:0\"'}">MEM</td>
                <td class="cell-wb ${subCycle >= 5 ? '' : 'style=\"opacity:0\"'}">WB</td>
              </tr>
              <tr>
                <td style="text-align:left; color:#f8fafc;">LW R3, 4(R2)</td>
                <td></td>
                <td class="cell-if ${subCycle >= 2 ? '' : 'style=\"opacity:0\"'}">IF</td>
                <td class="cell-id ${subCycle >= 3 ? '' : 'style=\"opacity:0\"'}">ID</td>
                <td class="cell-ex ${subCycle >= 4 ? '' : 'style=\"opacity:0\"'}">EX</td>
                <td class="cell-mem ${subCycle >= 5 ? '' : 'style=\"opacity:0\"'}">MEM</td>
              </tr>

  }
  else if (sec >= 15 && sec < 30) {
    pill.textContent = "STEP 2 OF 3: DEMONSTRATE FORWARDING & HAZARDS";

  else {

function updateProgress() {
  const frac = currentTime / TOTAL_DURATION;
  document.getElementById('progressFill').style.width = (frac * 100) + '%';
  const m = Math.floor(currentTime / 60);
  const s = Math.floor(currentTime % 60);
  document.getElementById('timerText').textContent = `${m}:${s < 10 ? '0' : ''}${s} / 0:45`;
}

function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById('btnPlay').textContent = isPlaying ? '⏸' : '▶';
  initAudio();
  if (isPlaying) {
    startMusicLoop();
    mainTimer = setInterval(() => {
      currentTime += 0.2;
      if (currentTime >= TOTAL_DURATION) {
        currentTime = TOTAL_DURATION;
        isPlaying = false;
        clearInterval(mainTimer);
        document.getElementById('btnPlay').textContent = '▶';
      }
      renderFrame(currentTime);
      updateProgress();
    }, 200);
  } else {
    clearInterval(mainTimer);
    clearInterval(musicTimer);
  }
}

function seekTrack(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const frac = (e.clientX - rect.left) / rect.width;
  currentTime = frac * TOTAL_DURATION;
  renderFrame(currentTime);
  updateProgress();
}

function recordVideoForGithub() {
  alert("To record this 45-second video file for GitHub on Windows:\n\n1. Press [Win + Alt + R] to start Windows Screen Recorder.\n2. Click the [Play ▶] button.\n3. When it reaches 0:45, press [Win + Alt + R] again.\n\nYour video will be saved in Videos/Captures as an MP4 ready to upload to GitHub!");
}

renderFrame(0);
updateProgress();
