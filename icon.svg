<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded app icon frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Outer chip pins (Top, Bottom, Left, Right) -->
  <g fill="#38bdf8" opacity="0.75">
    <!-- Top Pins -->
    <rect x="120" y="8" width="16" height="24" rx="4"/>
    <rect x="160" y="8" width="16" height="24" rx="4"/>
    <rect x="200" y="8" width="16" height="24" rx="4"/>
    <rect x="240" y="8" width="16" height="24" rx="4"/>
    <rect x="280" y="8" width="16" height="24" rx="4"/>
    <rect x="320" y="8" width="16" height="24" rx="4"/>
    <rect x="360" y="8" width="16" height="24" rx="4"/>
    
    <!-- Bottom Pins -->
    <rect x="120" y="480" width="16" height="24" rx="4"/>
    <rect x="160" y="480" width="16" height="24" rx="4"/>
    <rect x="200" y="480" width="16" height="24" rx="4"/>
    <rect x="240" y="480" width="16" height="24" rx="4"/>
    <rect x="280" y="480" width="16" height="24" rx="4"/>
    <rect x="320" y="480" width="16" height="24" rx="4"/>
    <rect x="360" y="480" width="16" height="24" rx="4"/>
    
    <!-- Left Pins -->
    <rect x="8" y="120" width="24" height="16" rx="4"/>
    <rect x="8" y="160" width="24" height="16" rx="4"/>
    <rect x="8" y="200" width="24" height="16" rx="4"/>
    <rect x="8" y="240" width="24" height="16" rx="4"/>
    <rect x="8" y="280" width="24" height="16" rx="4"/>
    <rect x="8" y="320" width="24" height="16" rx="4"/>
    <rect x="8" y="360" width="24" height="16" rx="4"/>
    
    <!-- Right Pins -->
    <rect x="480" y="120" width="24" height="16" rx="4"/>
    <rect x="480" y="160" width="24" height="16" rx="4"/>
    <rect x="480" y="200" width="24" height="16" rx="4"/>
    <rect x="480" y="240" width="24" height="16" rx="4"/>
    <rect x="480" y="280" width="24" height="16" rx="4"/>
    <rect x="480" y="320" width="24" height="16" rx="4"/>
    <rect x="480" y="360" width="24" height="16" rx="4"/>
  </g>

  <!-- CPU Heatspreader / Package Core -->
  <rect x="80" y="80" width="352" height="352" rx="40" fill="url(#coreGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="3" filter="url(#glow)"/>

  <!-- Trace lines on the silicon die -->
  <g stroke="#38bdf8" stroke-width="2.5" opacity="0.4" fill="none">
    <path d="M 120 160 L 170 160 L 190 190 L 260 190"/>
    <path d="M 392 160 L 342 160 L 322 190 L 260 190"/>
    <path d="M 120 352 L 180 352 L 210 320 L 260 320"/>
    <path d="M 392 352 L 332 352 L 302 320 L 260 320"/>
  </g>

  <!-- Central Silicon Die -->
  <rect x="146" y="146" width="220" height="220" rx="20" fill="#040711" stroke="url(#accentGrad)" stroke-width="4"/>

  <!-- 5 Stage pipeline bars inside central die -->
  <g transform="translate(166, 175)">
    <!-- IF -->
    <rect x="0" y="0" width="30" height="160" rx="6" fill="#38bdf8"/>
    <!-- ID -->
    <rect x="38" y="0" width="30" height="160" rx="6" fill="#a855f7"/>
    <!-- EX -->
    <rect x="76" y="0" width="30" height="160" rx="6" fill="#10b981"/>
    <!-- MEM -->
    <rect x="114" y="0" width="30" height="160" rx="6" fill="#f59e0b"/>
    <!-- WB -->
    <rect x="152" y="0" width="30" height="160" rx="6" fill="#ec4899"/>
  </g>

  <!-- Fast Forwarding Arrow connecting EX and WB -->
  <path d="M 320 280 Q 256 340 190 280" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"/>
  <polygon points="190,280 206,274 202,289" fill="#38bdf8"/>

  <!-- Title Monogram / Text -->
  <text x="256" y="468" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" letter-spacing="4">PIPELAB</text>
</svg>
